
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bear Hub</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #0a0a0a;
    color: white;
    min-height: 100vh;
    padding: 20px 15px 30px;
}

/* TOPBAR */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 65px;
}

.brand {
    display: flex;
    align-items: baseline;
    gap: 7px;
    white-space: nowrap;
}

.brand-name {
    font-size: 23px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 12px #1a73e8;
}

.brand-author {
    font-size: 11px;
    color: #888;
}

/* SOCIAL BUTTONS */
.top-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.top-right a,
.theme-toggle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1a1a2e;
    border: 1px solid #333;
    color: white;
    text-decoration: none;
    cursor: pointer;
    transition: .3s;
    flex-shrink: 0;
}

.top-right a:hover,
.theme-toggle:hover {
    transform: scale(1.1);
    border-color: #1a73e8;
}

/* CONTAINER */
.container {
    max-width: 900px;
    margin: auto;
}

/* ROBLOX BUTTON */
.roblox-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    max-width: 350px;
    margin: 0 auto 20px;
    padding: 15px;
    background: #151515;
    border: 1px solid #1a73e8;
    border-radius: 12px;
    color: white;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

.roblox-btn img {
    width: 22px;
    height: 22px;
    object-fit: contain;
    border-radius: 4px;
}

.roblox-btn:hover {
    background: #1a73e8;
    transform: translateY(-3px);
    box-shadow: 0 0 15px #1a73e855;
}

/* ROBLOX PAGE */
#robloxPage {
    display: none;
}

.back-btn {
    background: #151515;
    border: 1px solid #333;
    color: #aaa;
    padding: 10px 15px;
    border-radius: 9px;
    cursor: pointer;
    margin-bottom: 20px;
    transition: .3s;
}

.back-btn:hover {
    color: white;
    border-color: #1a73e8;
}

/* SUB TABS */
.sub-tabs {
    display: flex;
    width: 100%;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 20px;
    scrollbar-width: none;
}

.sub-tabs::-webkit-scrollbar {
    display: none;
}

.sub-tab {
    flex: 1;
    min-width: 90px;
    padding: 12px 15px;
    background: #151515;
    border: 1px solid #333;
    border-radius: 10px;
    color: #888;
    cursor: pointer;
    transition: .25s;
    white-space: nowrap;
}

.sub-tab:hover {
    color: white;
    border-color: #1a73e8;
}

.sub-tab.active {
    background: #1a73e8;
    color: white;
    border-color: #1a73e8;
}

/* SUB TAB CONTENT */
.sub-content {
    display: none;
    background: #111;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 20px;
    min-height: 150px;
}

.sub-content.active {
    display: block;
}

.sub-content h2 {
    font-size: 20px;
    margin-bottom: 10px;
    color: #1a73e8;
}

.sub-content p {
    color: #888;
    font-size: 14px;
}

/* SCRIPT LINK BUTTON */
.script-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    background: #151515;
    border: 1px solid #1a73e8;
    border-radius: 10px;
    color: white;
    text-decoration: none;
    transition: .3s;
}

.script-link:hover {
    background: #1a73e8;
    transform: translateY(-2px);
    box-shadow: 0 0 15px #1a73e855;
}

.script-link .link-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.script-link .link-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: #1a73e8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
}

.script-link .link-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.script-link .link-title {
    font-size: 15px;
    font-weight: bold;
    color: white;
}

.script-link .link-desc {
    font-size: 12px;
    color: #888;
}

.script-link .link-arrow {
    color: #888;
    flex-shrink: 0;
}

.script-link:hover .link-arrow,
.script-link:hover .link-desc {
    color: white;
}

/* FOOTER */
.footer {
    text-align: center;
    color: #555;
    margin-top: 30px;
    font-size: 13px;
}

/* LIGHT MODE */
body.light {
    background: #f4f6fb;
    color: #111;
}

body.light .brand-name {
    color: #111;
    text-shadow: none;
}

body.light .top-right a,
body.light .theme-toggle {
    background: #ddd;
    color: #111;
}

body.light .roblox-btn {
    background: white;
    color: #111;
}

body.light .back-btn {
    background: #eee;
    color: #333;
}

body.light .sub-tab {
    background: #e5e5e5;
    color: #555;
}

body.light .sub-tab.active {
    background: #1a73e8;
    color: white;
}

body.light .sub-content {
    background: white;
    border-color: #ddd;
}

body.light .script-link {
    background: #f7f7f7;
    color: #111;
}

body.light .script-link .link-title {
    color: #111;
}

body.light .script-link .link-desc {
    color: #777;
}

body.light .script-link .link-arrow {
    color: #777;
}

body.light .script-link:hover {
    background: #1a73e8;
}

body.light .script-link:hover .link-title,
body.light .script-link:hover .link-desc,
body.light .script-link:hover .link-arrow {
    color: white;
}

/* MOBILE */
@media(max-width:600px) {
    body {
        padding: 15px 10px 25px;
    }

    .topbar {
        gap: 5px;
        margin-bottom: 60px;
    }

    .brand {
        gap: 4px;
    }

    .brand-name {
        font-size: 18px;
    }

    .brand-author {
        font-size: 9px;
    }

    .top-right {
        gap: 4px;
    }

    .top-right a,
    .theme-toggle {
        width: 32px;
        height: 32px;
        font-size: 12px;
    }

    .sub-tab {
        padding: 11px 12px;
    }

    .sub-content {
        padding: 15px;
    }
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">

    <div class="brand">
        <span class="brand-name">Bear Hub</span>
        <span class="brand-author">by Quang Huy</span>
    </div>

    <div class="top-right">

        <a href="https://www.tiktok.com/@huyscriptth" target="_blank" rel="noopener">
            <i class="fab fa-tiktok"></i>
        </a>

        <a href="https://youtube.com/@huyscriptth" target="_blank" rel="noopener">
            <i class="fab fa-youtube"></i>
        </a>

        <a href="https://discord.gg/rW6yuRqAu" target="_blank" rel="noopener">
            <i class="fab fa-discord"></i>
        </a>

        <button class="theme-toggle" id="themeToggle">
            <i class="fas fa-moon"></i>
        </button>

    </div>
</div>

<div class="container">

    <!-- MAIN PAGE -->
    <div id="mainPage">

        <button class="roblox-btn" id="openRoblox">
            <img src="https://store-images.s-microsoft.com/image/apps.57357.14294982842551334.bc68eb2f-01f8-451f-85fc-6428e4bd5d81.c1bf4bb1-19cd-48cf-b723-0bff74e4ecf3" alt="Roblox">
            <span>Roblox</span>
        </button>

    </div>

    <!-- ROBLOX PAGE -->
    <div id="robloxPage">

        <button class="back-btn" id="backBtn">
            <i class="fas fa-arrow-left"></i> Quay lại
        </button>

        <!-- 3 SUB TABS -->
        <div class="sub-tabs">

            <button class="sub-tab active" data-tab="delta">
                <i class="fas fa-bolt"></i> Delta
            </button>

            <button class="sub-tab" data-tab="bearhub">
                <i class="fas fa-code"></i> Script Bear Hub
            </button>

            <button class="sub-tab" data-tab="bloxfruits">
                <i class="fas fa-gamepad"></i> Script Blox Fruits
            </button>

        </div>

        <!-- DELTA -->
        <div class="sub-content active" id="tab-delta">
            <h2>Delta</h2>
            <p>Danh sách Delta</p>

            <a class="script-link"
               href="https://link4sub.com/63eheezb"
               target="_blank"
               rel="noopener">

                <div class="link-left">
                    <div class="link-icon">
                        <i class="fas fa-bolt"></i>
                    </div>

                    <div class="link-text">
                        <span class="link-title">Delta QT V2.747</span>
                        <span class="link-desc">Bấm để mở liên kết</span>
                    </div>
                </div>

                <i class="fas fa-arrow-up-right-from-square link-arrow"></i>
            </a>

        </div>

        <!-- SCRIPT BEAR HUB -->
        <div class="sub-content" id="tab-bearhub">
            <h2>Script Bear Hub</h2>
            <p>Danh sách Script Bear Hub</p>

            <!-- BEAR HUB TỔNG HỢP -->
            <a class="script-link"
               href="https://link4sub.com/bearhubth"
               target="_blank"
               rel="noopener">

                <div class="link-left">
                    <div class="link-icon">
                        <i class="fas fa-code"></i>
                    </div>

                    <div class="link-text">
                        <span class="link-title">Bear Hub Tổng hợp</span>
                        <span class="link-desc">Bấm để mở liên kết</span>
                    </div>
                </div>

                <i class="fas fa-arrow-up-right-from-square link-arrow"></i>
            </a>

        </div>

        <!-- SCRIPT BLOX FRUITS -->
        <div class="sub-content" id="tab-bloxfruits">
            <h2>Script Blox Fruits</h2>
            <p>Nội dung Script Blox Fruits sẽ hiển thị tại đây.</p>
        </div>

    </div>

    <div class="footer">
        Bear Hub • by Quang Huy
    </div>

</div>

<script>
/* OPEN ROBLOX PAGE */
const mainPage = document.getElementById("mainPage");
const robloxPage = document.getElementById("robloxPage");

document.getElementById("openRoblox").onclick = () => {
    mainPage.style.display = "none";
    robloxPage.style.display = "block";
};

/* BACK TO MAIN */
document.getElementById("backBtn").onclick = () => {
    robloxPage.style.display = "none";
    mainPage.style.display = "block";
};

/* SUB TAB SWITCH */
const subTabs = document.querySelectorAll(".sub-tab");
const subContents = document.querySelectorAll(".sub-content");

subTabs.forEach(tab => {
    tab.onclick = () => {
        subTabs.forEach(t => t.classList.remove("active"));
        subContents.forEach(c => c.classList.remove("active"));

        tab.classList.add("active");

        const target = document.getElementById("tab-" + tab.dataset.tab);
        if (target) {
            target.classList.add("active");
        }
    };
});

/* THEME */
const themeToggle = document.getElementById("themeToggle");

themeToggle.onclick = () => {
    document.body.classList.toggle("light");

    const icon = themeToggle.querySelector("i");

    icon.className = document.body.classList.contains("light")
        ? "fas fa-sun"
        : "fas fa-moon";
};
</script>

</body>
</html>
